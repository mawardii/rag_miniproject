[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-miniproject"
version = "0.1.0"
description = "RAG QA service over road-damage-detection research papers (FAISS + DeepSeek + OpenAI embeddings)"
requires-python = ">=3.10"
dependencies = [
    "langchain==0.3.7",
    "langchain-openai==0.2.8",
    "langchain-community==0.3.7",
    "openai>=1.60.0",
    "python-dotenv==1.0.1",
    "streamlit==1.38.0",
    "faiss-cpu==1.8.0",
    "pypdf==4.3.1",
    "tiktoken==0.7.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.5.7",
    "pytest==8.3.2",
]

# Pre-Phase-2 flat layout: install the top-level modules directly.
# Phase 2 replaces this with a proper src/rag package.
[tool.setuptools]
py-modules = ["main", "embeddings", "prototype", "query_test"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["rag-cloud"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sorting, B bugbear (real bug patterns), UP modernize syntax
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
