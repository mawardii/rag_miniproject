[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-miniproject"
version = "0.1.0"
description = "RAG QA service over SEC filings (FAISS + DeepSeek + OpenAI embeddings, FinanceBench eval)"
requires-python = ">=3.10"
dependencies = [
    "langchain==0.3.7",
    "langchain-openai==0.2.8",
    "langchain-community==0.3.7",
    "openai>=1.60.0",
    "python-dotenv==1.0.1",
    "streamlit==1.38.0",
    "faiss-cpu==1.8.0",
    "pypdf==4.3.1",
    "tiktoken==0.7.0",
    "pydantic-settings==2.4.0",
    "rank-bm25==0.2.2",
]

[project.scripts]
rag-ingest = "rag.cli:main"
rag-eval = "rag.evaluation:main"

[project.optional-dependencies]
dev = [
    "ruff==0.5.7",
    "pytest==8.3.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["rag-cloud"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sorting, B bugbear (real bug patterns), UP modernize syntax
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
